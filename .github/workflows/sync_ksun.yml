name: Auto-Sync KernelSU-Next
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Update Submodule and Multi-Commit Sync
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. Get the current tracked hash
          OLD_HASH=$(git rev-parse :KernelSU-Next)
          
          # 2. Update the submodule to latest legacy
          cd KernelSU-Next
          git fetch origin legacy
          git checkout legacy
          git pull origin legacy
          NEW_HASH=$(git rev-parse HEAD)
          
          # 3. Check if an update is actually needed
          if [ "$OLD_HASH" != "$NEW_HASH" ]; then
            # Get the very latest commit title for the Subject
            LATEST_TITLE=$(git log -1 --pretty=%s)
            
            # Get the 5 most recent commits for the Body
            RECENT_LOGS=$(git log -n 5 --oneline)
            
            cd ..
            git add KernelSU-Next
            
            # 4. Commit: Subject = Latest title, Body = Top 5 commits
            git commit -m "$LATEST_TITLE" -m "Recent legacy changes:" -m "$RECENT_LOGS"
            git push
          else
            echo "Already synced with the latest legacy branch."
          fi
