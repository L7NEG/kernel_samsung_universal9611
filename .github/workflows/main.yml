name: Build Grass Kernel
on:
  workflow_dispatch:
    inputs:
      target_device:
        description: 'Select Device'
        required: true
        default: 'all'
        type: choice
        options: [all, a51, m21, m31, m31s, f41, m30s]
      build_variant:
        description: 'Build Variant'
        required: true
        default: 'both'
        type: choice
        options: [OneUI, AOSP, both]
      ksu_option:
        description: 'KernelSU Option'
        required: true
        default: 'both'
        type: choice
        options: [KSU, NoKSU, both]
      publish_release:
        description: 'Publish to Nightly Release?'
        required: true
        type: boolean
        default: true
  push:
    paths:
      - 'KernelSU-Next'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON((github.event.inputs.target_device == 'all' || github.event.inputs.target_device == '') && '["a51","m21","m31","m31s","f41","m30s"]' || format('["{0}"]', github.event.inputs.target_device)) }}
        variant: ${{ fromJSON((github.event.inputs.build_variant == 'both' || github.event.inputs.build_variant == '') && '["OneUI","AOSP"]' || format('["{0}"]', github.event.inputs.build_variant)) }}
        ksu: ${{ fromJSON((github.event.inputs.ksu_option == 'both' || github.event.inputs.ksu_option == '') && '["KSU","NoKSU"]' || format('["{0}"]', github.event.inputs.ksu_option)) }}

    name: "Build: ${{ matrix.device }} (${{ matrix.variant }}) - ${{ matrix.ksu }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Toolchain
        run: |
          wget https://github.com/XSans0/WeebX-Clang/releases/download/WeebX-Clang-18.1.8-release/WeebX-Clang-18.1.8.tar.gz -O "weebx-clang.tar.gz"
          mkdir -p toolchain && tar -xf weebx-clang.tar.gz -C toolchain

      - name: KernelSU-Next Setup
        if: ${{ matrix.ksu == 'KSU' }}
        run: |
          ./KernelSU-Next/kernel/setup.sh legacy

          cd KernelSU-Next/kernel
          KSU_VERSION=$(expr $(git rev-list --count HEAD) + 10200)
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV

          sed -i "s/DKSU_VERSION=[0-9]*/DKSU_VERSION=${KSU_VERSION}/" Makefile

      - name: Build Kernel
        run: |
          VARIANT_FLAG="--$(echo "${{ matrix.variant }}" | tr '[:upper:]' '[:lower:]')"
          KSU_FLAG="${{ matrix.ksu == 'NoKSU' && '--no-ksu' || '' }}"
          python3 build_kernel.py $VARIANT_FLAG --target=${{ matrix.device }} $KSU_FLAG

      - name: Rename build output
        run: |
          SUFFIX="${{ matrix.device }}-${{ matrix.variant }}-${{ matrix.ksu }}"
          for f in GrassKernel*.zip; do
            mv "$f" "${f%.zip}-${SUFFIX}.zip"
          done

      - name: Generate Changelog Tables
        run: |
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          echo "---" > release_entry.md
          echo "### Build: ${{ matrix.device }} (${{ matrix.variant }})" >> release_entry.md
          echo "| Property | Details |" >> release_entry.md
          echo "| :--- | :--- |" >> release_entry.md
          echo "| **Device** | \`${{ matrix.device }}\` |" >> release_entry.md
          echo "| **Variant** | ${{ matrix.variant }} |" >> release_entry.md
          echo "| **KernelSU** | ${{ matrix.ksu == 'KSU' && 'Enabled' || 'Disabled' }} |" >> release_entry.md
          echo "| **KSU Version** | \`${{ env.KSUVER || 'N/A' }}\` |" >> release_entry.md
          echo "| **Timestamp** | $(date +'%Y-%m-%d %H:%M UTC') |" >> release_entry.md
          echo "" >> release_entry.md
          echo "#### Recent Commits" >> release_entry.md
          echo "| Hash | Message | Author |" >> release_entry.md
          echo "| :--- | :--- | :--- |" >> release_entry.md
          git log -n 10 --pretty=format:"| [\`%h\`](${REPO_URL}/commit/%H) | %s | %an |" >> release_entry.md
          echo "" >> release_entry.md

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: kernel-${{ matrix.device }}-${{ matrix.variant }}-${{ matrix.ksu }}
          path: |
            GrassKernel*.zip
            release_entry.md

      - name: Action Page Summary
        if: success()
        run: |
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          echo "## Build: ${{ matrix.device }} (${{ matrix.variant }}) - ${{ matrix.ksu }}" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Details |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Device** | \`${{ matrix.device }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Variant** | ${{ matrix.variant }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **KernelSU** | ${{ matrix.ksu == 'KSU' && 'Enabled' || 'Disabled' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **KSU Version** | \`${{ env.KSUVER || 'N/A' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Timestamp** | $(date +'%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Recent Commits" >> $GITHUB_STEP_SUMMARY
          echo "| Hash | Message | Author |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          git log -n 10 --pretty=format:"| [\`%h\`](${REPO_URL}/commit/%H) | %s | %an |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

  publish:
    needs: build
    if: ${{ always() && needs.build.result == 'success' && (github.event.inputs.publish_release == 'true' || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all builds
        uses: actions/download-artifact@v6
        with:
          path: all_kernels
          merge-multiple: true

      - name: Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Grass Kernel Nightly Builds"
          body: "Automated nightly build for Samsung Universal9611 devices. Synced with KernelSU-Next legacy branch."
          make_latest: true
          files: all_kernels/GrassKernel*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
