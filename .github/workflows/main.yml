name: Build Kernel

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: ['OneUI']
        device: ['m31']
    name: "Build for ${{matrix.device}} (${{matrix.build_type}})"
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Initialize submodules
        run: git submodule update --init --recursive
          
      - name: Install WeebX Clang
        run: |
          wget https://github.com/XSans0/WeebX-Clang/releases/download/WeebX-Clang-18.1.8-release/WeebX-Clang-18.1.8.tar.gz -O "weebx-clang.tar.gz"
          rm -rf toolchain && mkdir toolchain && tar -xvf weebx-clang.tar.gz -C toolchain && rm -rf weebx-clang.tar.gz
          
      - name: KernelSU-Next Setup
        run: ./KernelSU-Next/kernel/setup.sh
        
      - name: Set KernelSU-Next version
        run: |
          cd KernelSU-Next/kernel
          BASE_VERSION=10200
          KSU_VERSION=$(expr $(git rev-list --count HEAD) + "$BASE_VERSION")
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
          sed -i "s/DKSU_VERSION=11998/DKSU_VERSION=${KSU_VERSION}/" Makefile
          
      - name: Build
        run: |
          BUILD_TYPE_LOWER=$(echo "${{matrix.build_type}}" | tr '[:upper:]' '[:lower:]')
          python build_kernel.py --$BUILD_TYPE_LOWER --target=${{matrix.device}}
          # Use a wildcard that matches 'GrassKSU' or 'GrassKernel'
          mv Grass*.zip "GrassKernel_${{matrix.device}}_${{matrix.build_type}}-KSU.zip"

      - name: Show Build Logs
        if: failure()
        run: |
          echo "=== STDOUT LOG ==="
          cat *_stdout.log || true
          echo "=== STDERR LOG ==="
          cat *_stderr.log || true

      - name: Upload Kernel
        if: success()
        uses: actions/upload-artifact@main
        with:
          name: GrassKernel_${{matrix.device}}_${{matrix.build_type}}-KSU
          path: "GrassKernel_${{matrix.device}}_${{matrix.build_type}}-KSU.zip"
          if-no-files-found: error

      - name: Upload Logs (if Failed)
        if: failure()
        uses: actions/upload-artifact@main
        with:
          name: GrassKernel_${{matrix.device}}_${{matrix.build_type}}-LOG
          path: "*.log"
          if-no-files-found: warn
