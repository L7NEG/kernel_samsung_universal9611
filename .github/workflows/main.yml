name: Build Grass Kernel
on:
  workflow_dispatch:
    inputs:
      target_device:
        description: 'Select Device'
        required: true
        default: 'all'
        type: choice
        options: [all, a51, m21, m31, m31s, f41, m30s]
      build_variant:
        description: 'Build Variant'
        required: true
        default: 'both'
        type: choice
        options: [OneUI, AOSP, both]
      ksu_option:
        description: 'KernelSU Option'
        required: true
        default: 'both'
        type: choice
        options: [KSU, NoKSU, both]
      publish_release:
        description: 'Publish to Nightly Release?'
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(github.event.inputs.target_device == 'all' && '["a51", "m21", "m31", "m31s", "f41", "m30s"]' || format('["{0}"]', github.event.inputs.target_device)) }}
        variant: ${{ fromJSON(github.event.inputs.build_variant == 'both' && '["OneUI", "AOSP"]' || format('["{0}"]', github.event.inputs.build_variant)) }}
        ksu: ${{ fromJSON(github.event.inputs.ksu_option == 'both' && '["KSU", "NoKSU"]' || format('["{0}"]', github.event.inputs.ksu_option)) }}
    
    name: "Build: ${{ matrix.device }} (${{ matrix.variant }}) - ${{ matrix.ksu }}"
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Toolchain
        run: |
          wget https://github.com/XSans0/WeebX-Clang/releases/download/WeebX-Clang-18.1.8-release/WeebX-Clang-18.1.8.tar.gz -O "weebx-clang.tar.gz"
          mkdir -p toolchain && tar -xf weebx-clang.tar.gz -C toolchain
          
      - name: KernelSU-Next Setup
        if: ${{ matrix.ksu == 'KSU' }}
        run: |
          ./KernelSU-Next/kernel/setup.sh legacy
          cd KernelSU-Next/kernel
          KSU_VERSION=$(expr $(git rev-list --count HEAD) + 10200)
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
          sed -i "s/DKSU_VERSION=[0-9]*/DKSU_VERSION=${KSU_VERSION}/" Makefile
          
      - name: Build Kernel
        run: |
          VARIANT_FLAG="--$(echo "${{ matrix.variant }}" | tr '[:upper:]' '[:lower:]')"
          KSU_FLAG="${{ matrix.ksu == 'NoKSU' && '--no-ksu' || '' }}"
          python3 build_kernel.py $VARIANT_FLAG --target=${{ matrix.device }} $KSU_FLAG

      - name: Generate Changelog Tables
        run: |
          echo "---" > release_entry.md
          echo "### 📦 Build: ${{ matrix.device }} (${{ matrix.variant }})" >> release_entry.md
          echo "| Property | Details |" >> release_entry.md
          echo "| :--- | :--- |" >> release_entry.md
          echo "| **Device** | \`${{ matrix.device }}\` |" >> release_entry.md
          echo "| **Variant** | ${{ matrix.variant }} |" >> release_entry.md
          echo "| **KernelSU** | ${{ matrix.ksu == 'KSU' && '✅ Enabled' || '❌ Disabled' }} |" >> release_entry.md
          echo "| **KSU Version** | \`${{ env.KSUVER || 'N/A' }}\` |" >> release_entry.md
          echo "| **Timestamp** | $(date +'%Y-%m-%d %H:%M') |" >> release_entry.md
          echo "" >> release_entry.md
          echo "#### 🛠 Recent Commits" >> release_entry.md
          echo "| Hash | Message | Author |" >> release_entry.md
          echo "| :--- | :--- | :--- |" >> release_entry.md
          git log -n 5 --pretty=format:"| %h | %s | %an |" >> release_entry.md
          echo "" >> release_entry.md

      # Always upload artifacts so you can download them from the Action summary
      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: GrassKernel-${{ matrix.device }}-${{ matrix.variant }}-${{ matrix.ksu }}
          path: GrassKernel*.zip

      # Only runs if "Publish to Nightly Release?" was checked
      - name: Nightly Release
        if: ${{ github.event.inputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Grass Kernel Nightly Builds"
          body_path: release_entry.md
          append_body: true 
          prerelease: true
          files: GrassKernel*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Action Page Summary
        if: success()
        run: |
          echo "## Build Info: ${{ matrix.device }}" >> $GITHUB_STEP_SUMMARY
          cat release_entry.md >> $GITHUB_STEP_SUMMARY
